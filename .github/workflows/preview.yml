name: Preview build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_preview:
    name: Build and upload preview artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production CSS
        run: npm run build:css:prod

      - name: Build site
        run: npm run build

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Upload built CSS
        uses: actions/upload-artifact@v4
        with:
          name: built-css
          path: css/style.min.css
