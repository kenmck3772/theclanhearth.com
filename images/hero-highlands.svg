<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Twilight over the Scottish Highlands</title>
  <desc id="desc">Stylised illustration of a Highland loch at twilight with mountains, heather, and a silhouetted castle keep.</desc>
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091530" />
      <stop offset="45%" stop-color="#172a50" />
      <stop offset="100%" stop-color="#3a2158" />
    </linearGradient>
    <radialGradient id="aurora" cx="70%" cy="18%" r="60%">
      <stop offset="0%" stop-color="rgba(120, 195, 255, 0.5)" />
      <stop offset="35%" stop-color="rgba(78, 170, 237, 0.28)" />
      <stop offset="100%" stop-color="rgba(32, 64, 128, 0)" />
    </radialGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3b53" />
      <stop offset="100%" stop-color="#0e1f33" />
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4b6d" />
      <stop offset="100%" stop-color="#182b46" />
    </linearGradient>
    <linearGradient id="heatherGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f2b6d" />
      <stop offset="100%" stop-color="#36123f" />
    </linearGradient>
    <linearGradient id="lochGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2747" />
      <stop offset="40%" stop-color="#123c5f" />
      <stop offset="100%" stop-color="#246c7a" />
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#skyGradient)" />
  <rect width="1600" height="1000" fill="url(#aurora)" />
  <path d="M0 520 C220 460 320 360 520 340 C720 320 880 420 1100 400 C1320 380 1440 320 1600 360 L1600 640 L0 640 Z" fill="url(#mountainFar)" opacity="0.85" />
  <path d="M0 610 C190 560 310 520 520 540 C780 570 990 470 1200 500 C1380 525 1480 560 1600 530 L1600 770 L0 770 Z" fill="url(#mountainNear)" opacity="0.9" />
  <path d="M0 720 C220 660 460 690 640 660 C820 630 1060 660 1280 620 C1420 596 1520 600 1600 610 L1600 900 L0 900 Z" fill="url(#lochGradient)" opacity="0.92" />
  <g filter="url(#grain)">
    <rect y="700" width="1600" height="300" fill="#1b0f25" opacity="0.32" />
  </g>
  <g fill="url(#heatherGradient)" opacity="0.88">
    <path d="M0 820 C150 780 260 840 420 810 C560 784 660 830 820 800 C980 770 1120 820 1280 780 C1420 746 1520 780 1600 760 L1600 1000 L0 1000 Z" />
  </g>
  <g fill="#0b1728" opacity="0.8">
    <path d="M1080 620 L1150 620 L1168 700 L1040 700 Z" />
    <path d="M1040 700 L1178 700 L1178 760 L1040 760 Z" />
    <rect x="1115" y="580" width="20" height="70" />
    <rect x="1088" y="650" width="18" height="35" />
    <rect x="1145" y="650" width="18" height="35" />
  </g>
  <g fill="#a86bc7" opacity="0.6">
    <circle cx="320" cy="840" r="28" />
    <circle cx="360" cy="860" r="22" />
    <circle cx="420" cy="832" r="24" />
    <circle cx="460" cy="852" r="18" />
    <circle cx="510" cy="838" r="26" />
    <circle cx="560" cy="864" r="20" />
    <circle cx="620" cy="842" r="24" />
    <circle cx="700" cy="860" r="22" />
    <circle cx="760" cy="840" r="20" />
  </g>
  <g fill="#d4af37" opacity="0.25">
    <circle cx="1280" cy="240" r="120" />
  </g>
</svg>
