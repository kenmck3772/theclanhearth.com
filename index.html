<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Clan Hearth – Clans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/clans.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>Troimh theine tha sinn aonaichte</h1>
      </header>

      <div class="controls">
        <div class="search-wrapper">
          <label for="clan-search">Search Clans</label>
          <input
            type="text"
            id="clan-search"
            placeholder="Search by name, region, motto..."
            aria-label="Search clans by name, region, or motto"
          />
        </div>
        <div class="filter-wrapper">
          <label for="status-filter">Filter by Status</label>
          <select id="status-filter" aria-label="Filter clans by membership status">
            <option value="all">All Clans</option>
            <option value="founding">Founding Clans</option>
            <option value="member">Member Clans</option>
          </select>
        </div>
      </div>

      <main id="clan-list">
        <!-- JS will inject cards here -->
      </main>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
