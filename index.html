<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Clan Hearth – Clans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #020617; /* stone-950-ish */
        color: #e5e7eb;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid rgba(212, 163, 115, 0.6); /* gold-ish */
      }

      header h1 {
        margin: 0;
        font-family: "Cinzel", "Times New Roman", serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 1.1rem;
      }

      main {
        padding: 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
      }

      .clan-card {
        border: 1px solid rgba(212, 163, 115, 0.5);
        border-radius: 1rem;
        padding: 1rem;
        background: radial-gradient(circle at top, rgba(248, 250, 252, 0.06), transparent 55%);
        position: relative;
        overflow: hidden;
      }

      .clan-card h2 {
        margin: 0 0 0.25rem;
        font-family: "Cinzel", "Times New Roman", serif;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #22c55e; /* emerald-ish */
      }

      .clan-subtitle {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        opacity: 0.8;
      }

      .clan-images {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .clan-images img {
        width: 88px;
        height: 88px;
        object-fit: cover;
        border-radius: 0.75rem;
        border: 1px solid rgba(248, 250, 252, 0.2);
        background: #020617;
      }

      .clan-meta {
        font-size: 0.75rem;
        opacity: 0.9;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        border: 1px solid rgba(248, 250, 252, 0.12);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 0.5rem;
      }

      .tartan-stripe {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 0.75rem;
        display: flex;
      }

      .tartan-stripe-cell {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>Troimh theine tha sinn aonaichte</h1>
      </header>

      <main id="clan-list">
        <!-- JS will inject cards here -->
      </main>
    </div>

    <!-- app.js lives at site root -->
    <script src="/app.js"></script>
  </body>
</html>
